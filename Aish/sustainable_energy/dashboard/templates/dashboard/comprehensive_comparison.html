<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive ML Comparison - All 8 Objectives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        
        .container-fluid {
            max-width: 1600px;
        }
        
        .header-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .header-section h1 {
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .objective-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .objective-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }
        
        .objective-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .objective-badge {
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .badge-regression {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .badge-classification {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .chart-container {
            height: 400px;
            position: relative;
        }
        
        .best-model-banner {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loading-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }
        
        .spinner-border {
            width: 4rem;
            height: 4rem;
        }
        
        .summary-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .summary-table {
            width: 100%;
            margin-top: 20px;
        }
        
        .summary-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
        }
        
        .summary-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .model-score {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <div class="header-section">
            <h1><i class="fas fa-chart-bar"></i> Comprehensive ML Model Comparison</h1>
            <p class="text-muted">Comparing 7 Machine Learning Algorithms Across All 8 Objectives</p>
            <a href="/" class="btn btn-secondary btn-lg mt-3">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
        
        
        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay" style="display: none;">
            <div class="loading-content" style="padding: 25px;">
                <div class="spinner-border text-primary" role="status" style="width: 2.5rem; height: 2.5rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <h5 class="mt-3 mb-2">Running Analysis...</h5>
                <p class="text-muted" style="font-size: 0.9rem; margin-bottom: 10px;">Comparing ML models</p>
                <div class="progress" style="width: 200px; height: 8px;">
                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                         role="progressbar" style="width: 0%"></div>
                </div>
            </div>
        </div>
        
        <!-- Summary Section -->
        <div id="summarySection" class="summary-section" style="display: none;">
            <h2><i class="fas fa-trophy"></i> Best Models Summary</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>Objective</th>
                        <th>Name</th>
                        <th>Task</th>
                        <th>Best Model</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                </tbody>
            </table>
        </div>
        
        <!-- Results Container -->
        <div id="resultsContainer"></div>
        
        <!-- Loading Overlay - Hidden (models load in background) -->
        <div id="loadingOverlay" class="loading-overlay" style="display: none !important;">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script>
        let charts = {};
        
        // Auto-run comparison on page load
        window.addEventListener('DOMContentLoaded', function() {
            runComparison();
        });
        
        async function runComparison() {
            // Show loading overlay
            const loadingOverlay = document.getElementById('loadingOverlay');
            const progressBar = document.getElementById('progressBar');
            loadingOverlay.style.display = 'flex';
            
            // Clear previous results
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('summarySection').style.display = 'none';
            
            // Simulate progress
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 5;
                if (progress <= 90) {
                    progressBar.style.width = progress + '%';
                }
            }, 200);
            
            try {
                const response = await fetch('/api/comprehensive-comparison/');
                const data = await response.json();
                
                // Complete progress
                clearInterval(progressInterval);
                progressBar.style.width = '100%';
                
                // Small delay to show 100%
                await new Promise(resolve => setTimeout(resolve, 300));
                
                if (data.success) {
                    displayResults(data);
                    displaySummary(data.summary);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                clearInterval(progressInterval);
                alert('Error running comparison: ' + error.message);
            } finally {
                // Hide loading overlay
                loadingOverlay.style.display = 'none';
                progressBar.style.width = '0%';
            }
        }
        
        function displayResults(data) {
            const container = document.getElementById('resultsContainer');
            
            data.objectives.forEach(obj => {
                const subNo = obj.sub_no;
                const scores = data.results[subNo];
                
                if (!scores) return;
                
                const task = obj.task;
                const metric = task === 'classification' ? 'Accuracy' : 'MSE';
                
                // Find best model
                let bestModel, bestScore;
                if (task === 'classification') {
                    bestModel = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
                    bestScore = scores[bestModel];
                } else {
                    bestModel = Object.keys(scores).reduce((a, b) => scores[a] < scores[b] ? a : b);
                    bestScore = scores[bestModel];
                }
                
                // Create card
                const card = document.createElement('div');
                card.className = 'objective-card';
                card.innerHTML = `
                    <div class="objective-header">
                        <div class="objective-title">
                            <i class="fas fa-chart-line"></i> Objective ${subNo}: ${obj.name}
                        </div>
                        <div class="objective-badge badge-${task}">
                            ${task.toUpperCase()}
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="chart${subNo}"></canvas>
                    </div>
                    <div class="best-model-banner">
                        <i class="fas fa-trophy"></i> Best Model: ${bestModel} 
                        (${metric} = ${bestScore.toFixed(4)})
                    </div>
                `;
                
                container.appendChild(card);
                
                // Create chart
                createChart(subNo, scores, metric, bestModel);
            });
        }
        
        function createChart(subNo, scores, metric, bestModel) {
            const ctx = document.getElementById(`chart${subNo}`);
            
            const labels = Object.keys(scores);
            const values = Object.values(scores);
            
            // Color best model gold, others blue
            const colors = labels.map(label => 
                label === bestModel ? '#FFD700' : '#667eea'
            );
            
            charts[subNo] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: metric,
                        data: values,
                        backgroundColor: colors,
                        borderColor: colors.map(c => c === '#FFD700' ? '#FFA500' : '#4a5fc1'),
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: `Model Comparison (${metric})`,
                            font: {
                                size: 16,
                                weight: 'bold'
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: metric
                            }
                        }
                    }
                }
            });
        }
        
        function displaySummary(summary) {
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';
            
            Object.keys(summary).sort((a, b) => a - b).forEach(subNo => {
                const obj = summary[subNo];
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${subNo}</strong></td>
                    <td>${obj.name}</td>
                    <td><span class="badge bg-${obj.task === 'classification' ? 'danger' : 'primary'}">${obj.task}</span></td>
                    <td><strong>${obj.best_model}</strong></td>
                    <td><span class="model-score">${obj.best_score.toFixed(4)}</span></td>
                `;
                tbody.appendChild(row);
            });
            
            document.getElementById('summarySection').style.display = 'block';
        }
    </script>
</body>
</html>
