<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Logs - Admin Dashboard</title>
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .user-info span {
            color: #667eea;
            font-weight: bold;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 1em;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-group label {
            font-weight: bold;
            color: #667eea;
        }

        .filter-group select,
        .filter-group input {
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
        }

        .refresh-btn {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card.success .number { color: #28a745; }
        .stat-card.failed .number { color: #dc3545; }
        .stat-card.total .number { color: #667eea; }
        .stat-card.rate .number { color: #17a2b8; }

        .logs-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logs-container h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #667eea;
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            display: inline-block;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .alert-badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .alert-critical {
            background: #dc3545;
            color: white;
        }

        .alert-needs_improvement {
            background: #ffc107;
            color: #000;
        }

        .alert-excellent {
            background: #28a745;
            color: white;
        }

        .alert-good {
            background: #17a2b8;
            color: white;
        }

        .no-logs {
            text-align: center;
            padding: 50px;
            color: #999;
            font-size: 1.2em;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.9em;
            font-style: italic;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 1em;
            transition: all 0.3s;
            display: inline-block;
            margin-right: 10px;
        }

        .back-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #667eea;
        }
    </style></head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Email Logs Dashboard</h1>
            <p>Track all email alerts sent to countries</p>
            <div class="user-info">
                <span>👤 Logged in as: {{ user.username }}</span>
                <div>
                    <a href="{% url 'admin_panel' %}" class="back-btn">← Back to Admin Page</a>
                    <a href="/admin-logout/" class="logout-btn">Logout</a>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="filter-group">
                <label>Status:</label>
                <select id="statusFilter">
                    <option value="">All</option>
                    <option value="success">Success</option>
                    <option value="failed">Failed</option>
                    <option value="pending">Pending</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Alert Type:</label>
                <select id="alertTypeFilter">
                    <option value="">All</option>
                    <option value="critical">Critical</option>
                    <option value="needs_improvement">Needs Improvement</option>
                    <option value="excellent">Excellent</option>
                    <option value="good">Good</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Country:</label>
                <input type="text" id="countryFilter" placeholder="Search country...">
            </div>
            <button class="refresh-btn" onclick="loadLogs()">🔄 Refresh</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card total">
                <h3>Total Emails</h3>
                <div class="number" id="totalEmails">0</div>
            </div>
            <div class="stat-card success">
                <h3>Successful</h3>
                <div class="number" id="successEmails">0</div>
            </div>
            <div class="stat-card failed">
                <h3>Failed</h3>
                <div class="number" id="failedEmails">0</div>
            </div>
            <div class="stat-card rate">
                <h3>Success Rate</h3>
                <div class="number" id="successRate">0%</div>
            </div>
        </div>

        <div class="logs-container">
            <h2>Email History</h2>
            <div id="logsContent" class="loading">Loading email logs...</div>
        </div>
    </div>

    <script>
        let allLogs = [];

        async function loadLogs() {
            try {
                const response = await fetch('/api/email-logs/');
                const data = await response.json();

                if (data.success) {
                    allLogs = data.logs;
                    updateStats(allLogs);
                    displayLogs(allLogs);
                } else {
                    document.getElementById('logsContent').innerHTML = 
                        `<div class="no-logs">❌ Error loading logs: ${data.error}</div>`;
                }
            } catch (error) {
                document.getElementById('logsContent').innerHTML = 
                    `<div class="no-logs">❌ Error: ${error.message}</div>`;
            }
        }

        function updateStats(logs) {
            const total = logs.length;
            const success = logs.filter(log => log.status === 'success').length;
            const failed = logs.filter(log => log.status === 'failed').length;
            const rate = total > 0 ? ((success / total) * 100).toFixed(1) : 0;

            document.getElementById('totalEmails').textContent = total;
            document.getElementById('successEmails').textContent = success;
            document.getElementById('failedEmails').textContent = failed;
            document.getElementById('successRate').textContent = rate + '%';
        }

        function displayLogs(logs) {
            if (logs.length === 0) {
                document.getElementById('logsContent').innerHTML = 
                    '<div class="no-logs">📭 No email logs found</div>';
                return;
            }

            let html = `
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Date & Time</th>
                                <th>Country</th>
                                <th>Email</th>
                                <th>Alert Type</th>
                                <th>Access %</th>
                                <th>Year</th>
                                <th>Status</th>
                                <th>Sent By</th>
                                <th>Subject</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            logs.forEach(log => {
                const statusClass = `status-${log.status}`;
                const alertClass = `alert-${log.alert_type}`;
                const date = new Date(log.sent_at).toLocaleString();

                html += `
                    <tr>
                        <td>${date}</td>
                        <td><strong>${log.country}</strong></td>
                        <td>${log.recipient_email}</td>
                        <td><span class="alert-badge ${alertClass}">${log.alert_type.replace('_', ' ')}</span></td>
                        <td>${log.electricity_access.toFixed(1)}%</td>
                        <td>${log.year}</td>
                        <td><span class="status-badge ${statusClass}">${log.status}</span></td>
                        <td>${log.sent_by || 'System'}</td>
                        <td>
                            ${log.subject}
                            ${log.error_message ? `<br><span class="error-message">Error: ${log.error_message}</span>` : ''}
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            document.getElementById('logsContent').innerHTML = html;
        }

        function filterLogs() {
            const statusFilter = document.getElementById('statusFilter').value;
            const alertTypeFilter = document.getElementById('alertTypeFilter').value;
            const countryFilter = document.getElementById('countryFilter').value.toLowerCase();

            let filtered = allLogs;

            if (statusFilter) {
                filtered = filtered.filter(log => log.status === statusFilter);
            }

            if (alertTypeFilter) {
                filtered = filtered.filter(log => log.alert_type === alertTypeFilter);
            }

            if (countryFilter) {
                filtered = filtered.filter(log => 
                    log.country.toLowerCase().includes(countryFilter)
                );
            }

            updateStats(filtered);
            displayLogs(filtered);
        }

        // Add event listeners for filters
        document.getElementById('statusFilter').addEventListener('change', filterLogs);
        document.getElementById('alertTypeFilter').addEventListener('change', filterLogs);
        document.getElementById('countryFilter').addEventListener('input', filterLogs);

        // Load logs on page load
        loadLogs();

        // Auto-refresh every 30 seconds
        setInterval(loadLogs, 30000);
    </script>
</body>
</html>
