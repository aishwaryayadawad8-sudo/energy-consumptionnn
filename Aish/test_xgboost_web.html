<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XGBoost Alert System - Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-card .label {
            color: #666;
            font-size: 0.9em;
        }
        
        .action-panel {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .action-panel h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .country-select {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
        }
        
        .result-panel {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }
        
        .result-panel.show {
            display: block;
        }
        
        .result-panel h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .alert-success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .alert-error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .alert-info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        
        .prediction-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
        }
        
        .prediction-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .prediction-card .detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
        
        .prediction-card .detail:last-child {
            border-bottom: none;
        }
        
        .prediction-card .label {
            font-weight: bold;
            color: #666;
        }
        
        .prediction-card .value {
            color: #333;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .status-critical {
            background: #dc3545;
            color: white;
        }
        
        .status-needs_improvement {
            background: #ffc107;
            color: #333;
        }
        
        .status-good {
            background: #17a2b8;
            color: white;
        }
        
        .status-excellent {
            background: #28a745;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🚀 XGBoost Alert System</h1>
            <p>Machine Learning-Powered Electricity Access Predictions</p>
        </div>
        
        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="icon">🎯</div>
                <div class="value">99.16%</div>
                <div class="label">Model Accuracy</div>
            </div>
            <div class="stat-card">
                <div class="icon">🌍</div>
                <div class="value">128</div>
                <div class="label">Countries Covered</div>
            </div>
            <div class="stat-card">
                <div class="icon">📧</div>
                <div class="value">100%</div>
                <div class="label">Email Coverage</div>
            </div>
            <div class="stat-card">
                <div class="icon">⚡</div>
                <div class="value">15</div>
                <div class="label">ML Features</div>
            </div>
        </div>
        
        <!-- Action Panel -->
        <div class="action-panel">
            <h2>📬 Send Alert to Country</h2>
            <select id="countrySelect" class="country-select">
                <option value="">Select a country...</option>
                <option value="Albania">Albania</option>
                <option value="Kenya">Kenya</option>
                <option value="Nigeria">Nigeria</option>
                <option value="South Africa">South Africa</option>
                <option value="India">India</option>
                <option value="Brazil">Brazil</option>
                <option value="Egypt">Egypt</option>
                <option value="Ethiopia">Ethiopia</option>
                <option value="Bangladesh">Bangladesh</option>
                <option value="Pakistan">Pakistan</option>
            </select>
            
            <button class="btn btn-primary" onclick="sendAlert()">
                📧 Send XGBoost Alert
            </button>
            
            <button class="btn btn-success" onclick="sendAllAlerts()">
                🌍 Send Alerts to All Countries
            </button>
        </div>
        
        <!-- Result Panel -->
        <div id="resultPanel" class="result-panel">
            <h2>📊 Results</h2>
            <div id="resultContent"></div>
        </div>
    </div>
    
    <script>
        function sendAlert() {
            const country = document.getElementById('countrySelect').value;
            
            if (!country) {
                alert('Please select a country first!');
                return;
            }
            
            const resultPanel = document.getElementById('resultPanel');
            const resultContent = document.getElementById('resultContent');
            
            resultPanel.classList.add('show');
            resultContent.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Training XGBoost model and generating prediction for ${country}...</p>
                </div>
            `;
            
            // Simulate API call (replace with actual API endpoint)
            setTimeout(() => {
                resultContent.innerHTML = `
                    <div class="alert alert-success">
                        ✅ Alert sent successfully to ${country}!
                    </div>
                    
                    <div class="prediction-card">
                        <h3>🎯 Prediction Results</h3>
                        <div class="detail">
                            <span class="label">Country:</span>
                            <span class="value">${country}</span>
                        </div>
                        <div class="detail">
                            <span class="label">Current Access:</span>
                            <span class="value">100.00%</span>
                        </div>
                        <div class="detail">
                            <span class="label">Predicted Access:</span>
                            <span class="value">84.31%</span>
                        </div>
                        <div class="detail">
                            <span class="label">Change:</span>
                            <span class="value">-15.69%</span>
                        </div>
                        <div class="detail">
                            <span class="label">Status:</span>
                            <span class="value"><span class="status-badge status-good">Good</span></span>
                        </div>
                        <div class="detail">
                            <span class="label">Alert Type:</span>
                            <span class="value">Status Update</span>
                        </div>
                        <div class="detail">
                            <span class="label">Model Accuracy:</span>
                            <span class="value">99.16%</span>
                        </div>
                    </div>
                    
                    <div class="alert alert-info">
                        📧 Email sent to: electricity.prediction2000@gmail.com<br>
                        📊 Subject: Status Update: Electricity Access Progress in ${country}
                    </div>
                `;
            }, 3000);
        }
        
        function sendAllAlerts() {
            const resultPanel = document.getElementById('resultPanel');
            const resultContent = document.getElementById('resultContent');
            
            resultPanel.classList.add('show');
            resultContent.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Training XGBoost model and sending alerts to all countries...</p>
                </div>
            `;
            
            // Simulate API call
            setTimeout(() => {
                resultContent.innerHTML = `
                    <div class="alert alert-success">
                        ✅ Successfully sent 110 alerts to countries worldwide!
                    </div>
                    
                    <div class="prediction-card">
                        <h3>📊 Alert Distribution</h3>
                        <div class="detail">
                            <span class="label">🚨 Critical:</span>
                            <span class="value">16 countries</span>
                        </div>
                        <div class="detail">
                            <span class="label">⚠️ Needs Improvement:</span>
                            <span class="value">15 countries</span>
                        </div>
                        <div class="detail">
                            <span class="label">✅ Good:</span>
                            <span class="value">18 countries</span>
                        </div>
                        <div class="detail">
                            <span class="label">🎉 Excellent:</span>
                            <span class="value">79 countries</span>
                        </div>
                    </div>
                    
                    <div class="prediction-card">
                        <h3>🎯 Model Performance</h3>
                        <div class="detail">
                            <span class="label">Model Type:</span>
                            <span class="value">XGBoost</span>
                        </div>
                        <div class="detail">
                            <span class="label">Accuracy:</span>
                            <span class="value">99.16%</span>
                        </div>
                        <div class="detail">
                            <span class="label">MSE:</span>
                            <span class="value">8.51</span>
                        </div>
                        <div class="detail">
                            <span class="label">Total Predictions:</span>
                            <span class="value">128 countries</span>
                        </div>
                    </div>
                    
                    <div class="alert alert-info">
                        📧 Alerts sent to countries with critical, needs improvement, or excellent status<br>
                        📊 View detailed logs at: <a href="http://localhost:8000/email-logs/">Email Logs Dashboard</a>
                    </div>
                `;
            }, 5000);
        }
    </script>
</body>
</html>
