<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Objective 6 Labels Fix</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .chart-container {
            width: 100%;
            height: 600px;
            margin-top: 20px;
        }
        
        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Objective 6 Labels Fix Test</h1>
        
        <div class="info">
            <strong>Testing:</strong> All 7 model names should appear on x-axis, including "Random Forest" (highlighted in gold)
        </div>
        
        <button onclick="loadChart()" style="background: #2196F3; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
            Load Chart
        </button>
        
        <div id="modelList"></div>
        <div id="chartContainer" class="chart-container"></div>
    </div>
    
    <script>
        function loadChart() {
            // Exact data from Objective 6
            const modelData = {
                "Logistic Regression": 0.8808,
                "Decision Tree": 0.9767,
                "KNN": 0.9671,
                "XGBoost": 0.9781,
                "LightGBM": 0.9808,
                "CatBoost": 0.9863,
                "Random Forest": 0.9877
            };
            
            const models = Object.keys(modelData);
            const accuracyValues = Object.values(modelData);
            
            // Display model list for verification
            document.getElementById('modelList').innerHTML = 
                '<h3>Models to display:</h3><ul>' + 
                models.map((model, i) => `<li>${i+1}. ${model}: ${accuracyValues[i]}</li>`).join('') + 
                '</ul>';
            
            console.log('Models:', models);
            console.log('Values:', accuracyValues);
            
            // Create colors - Random Forest in gold
            const colors = models.map(model => 
                model === 'Random Forest' ? '#FFD700' : '#636EFA'
            );
            
            const trace = {
                x: models,
                y: accuracyValues,
                type: 'bar',
                marker: {
                    color: colors,
                    line: {
                        color: models.map(model => 
                            model === 'Random Forest' ? '#FFA500' : '#636EFA'
                        ),
                        width: 2
                    }
                },
                text: accuracyValues.map(v => v.toFixed(4)),
                textposition: 'outside',
                textfont: { 
                    size: 12,
                    color: 'black'
                },
                showlegend: false
            };
            
            const layout = {
                title: {
                    text: 'Sub-objective 6: Efficiency Optimization',
                    font: { 
                        size: 18,
                        color: '#2c3e50',
                        family: 'Arial, sans-serif'
                    },
                    x: 0.5,
                    xanchor: 'center'
                },
                xaxis: { 
                    title: {
                        text: 'Models',
                        font: { size: 14 }
                    },
                    tickfont: { size: 11 },
                    tickangle: -45,
                    automargin: true,
                    tickmode: 'array',
                    tickvals: models,
                    ticktext: models,
                    type: 'category'
                },
                yaxis: { 
                    title: {
                        text: 'Accuracy',
                        font: { size: 14 }
                    },
                    range: [0, 1.05],
                    tickfont: { size: 12 },
                    tickformat: '.2f'
                },
                height: 600,
                showlegend: false,
                plot_bgcolor: 'rgba(248, 249, 250, 0.8)',
                paper_bgcolor: 'white',
                margin: {
                    l: 80,
                    r: 150,
                    t: 100,
                    b: 150
                },
                annotations: [
                    {
                        text: 'CLASSIFICATION',
                        x: 1.02,
                        y: 0.95,
                        xref: 'paper',
                        yref: 'paper',
                        showarrow: false,
                        font: {
                            size: 12,
                            color: 'white',
                            family: 'Arial, sans-serif'
                        },
                        bgcolor: '#E91E63',
                        bordercolor: '#E91E63',
                        borderwidth: 2,
                        borderpad: 8,
                        xanchor: 'left'
                    }
                ]
            };
            
            Plotly.newPlot('chartContainer', [trace], layout, {responsive: true});
        }
        
        // Auto-load on page load
        window.onload = function() {
            loadChart();
        };
    </script>
</body>
</html>
