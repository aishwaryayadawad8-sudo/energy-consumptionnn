<!DOCTYPE html>
<html>
<head>
    <title>Test Email Alert System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #f9f9f9;
        }
        .loading {
            display: none;
            color: #666;
        }
        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Email Alert System</h1>
    
    <p>Click the button below to test sending email alerts to Albania:</p>
    
    <button onclick="testEmailAlert()">Send Alert to Albania</button>
    
    <div class="loading" id="loading">
        <p>⏳ Sending email alert...</p>
    </div>
    
    <div id="result"></div>
    
    <script>
        function testEmailAlert() {
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');
            
            resultDiv.innerHTML = '';
            loadingDiv.classList.add('active');
            
            const data = {
                countries: ['Albania']
            };
            
            fetch('http://127.0.0.1:8000/api/send-email-alerts-selected/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(data => {
                loadingDiv.classList.remove('active');
                console.log('Response data:', data);
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <h3>✅ Success!</h3>
                        <p><strong>${data.total_alerts}</strong> email alert(s) sent!</p>
                        <h4>Details:</h4>
                        <ul>
                            ${data.alerts_sent.map(alert => `
                                <li>
                                    <strong>${alert.country}</strong>: ${alert.access.toFixed(1)}% access<br>
                                    Status: ${alert.status}<br>
                                    Email: ${alert.email}
                                </li>
                            `).join('')}
                        </ul>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3>❌ Error</h3>
                        <p>${data.error || data.message || 'Unknown error'}</p>
                    `;
                }
            })
            .catch(error => {
                loadingDiv.classList.remove('active');
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <h3>❌ Error</h3>
                    <p>${error.message}</p>
                    <p>Check the browser console for more details.</p>
                `;
            });
        }
    </script>
</body>
</html>
