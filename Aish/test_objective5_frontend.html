<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Objective 5 Model Comparison</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .best-model-badge { 
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white; padding: 12px 20px; border-radius: 25px; 
            font-weight: bold; display: inline-block; margin: 15px 0;
        }
        #chartContainer { height: 400px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Objective 5: Energy Equity Analysis - Model Comparison</h1>
        
        <div class="test-section">
            <h2>📊 Model Comparison Test</h2>
            <button onclick="testModelComparison()" style="padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px;">
                🚀 Load Model Comparison
            </button>
            
            <div id="results" style="margin-top: 20px;"></div>
            <div id="chartContainer">
                <canvas id="testChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let testChart = null;

        function testModelComparison() {
            // Simulate the data that would come from the API
            const testData = {
                success: true,
                objective_name: "Energy Equity Analysis",
                task_type: "regression",
                metric: "MSE",
                mse_scores: {
                    "Linear Regression": 0.1902,
                    "Decision Tree": 0.0209,
                    "KNN": 0.0105,
                    "XGBoost": 0.0078,
                    "LightGBM": 0.0066,
                    "CatBoost": 0.0047,
                    "Random Forest": 0.0062
                },
                best_model: "CatBoost",
                best_score: 0.0047
            };

            displayResults(testData);
        }

        function displayResults(data) {
            // Display results info
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <h3>📋 Results:</h3>
                <p><strong>Objective:</strong> ${data.objective_name}</p>
                <p><strong>Task Type:</strong> ${data.task_type}</p>
                <p><strong>Metric:</strong> ${data.metric} (Lower is Better)</p>
                <div class="best-model-badge">
                    ⭐ Best Model: ${data.best_model} (${data.metric} = ${data.best_score.toFixed(4)})
                </div>
            `;

            // Create chart
            const ctx = document.getElementById('testChart').getContext('2d');
            
            if (testChart) {
                testChart.destroy();
            }
            
            const models = Object.keys(data.mse_scores);
            const scoreValues = Object.values(data.mse_scores);
            
            // Create colors array - highlight best model in gold
            const colors = models.map(model => 
                model === data.best_model ? 'rgba(255, 215, 0, 0.8)' : 'rgba(102, 126, 234, 0.7)'
            );
            const borderColors = models.map(model => 
                model === data.best_model ? 'rgba(255, 215, 0, 1)' : 'rgba(102, 126, 234, 1)'
            );
            
            testChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: models,
                    datasets: [{
                        label: `${data.metric} Score`,
                        data: scoreValues,
                        backgroundColor: colors,
                        borderColor: borderColors,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: `${data.objective_name} - ${data.metric} Comparison (Lower is Better)`,
                            font: {
                                size: 16,
                                weight: 'bold'
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed.y.toFixed(4);
                                    const isBest = context.label === data.best_model;
                                    return `${context.label}: ${value}${isBest ? ' ⭐ (Best)' : ''}`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: data.metric
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Machine Learning Models'
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
