<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Objective 6 Chart Display</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .test-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .chart-container {
            width: 100%;
            height: 600px;
            margin-top: 20px;
        }
        
        .best-model-banner {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1><i class="fas fa-chart-bar"></i> Objective 6 Chart Display Test</h1>
        <p class="text-muted">Testing the exact chart display to match the screenshot</p>
        
        <button class="btn btn-primary" onclick="loadChart()">
            <i class="fas fa-play"></i> Load Chart
        </button>
        
        <div id="chartContainer" class="chart-container"></div>
        <div id="bestModelBanner" style="display: none;"></div>
    </div>
    
    <script>
        function loadChart() {
            // Objective 6 model comparison data (from your code)
            const modelData = {
                "Logistic Regression": 0.8808,
                "Decision Tree": 0.9767,
                "KNN": 0.9671,
                "XGBoost": 0.9781,
                "LightGBM": 0.9808,
                "CatBoost": 0.9863,
                "Random Forest": 0.9877
            };
            
            const models = Object.keys(modelData);
            const accuracyValues = Object.values(modelData);
            const bestModel = "Random Forest";
            const bestScore = 0.9877;
            
            // Create colors array - highlight Random Forest in gold
            const colors = models.map(model => 
                model === 'Random Forest' ? '#FFD700' : '#636EFA'
            );
            
            const trace = {
                x: models,
                y: accuracyValues,
                type: 'bar',
                marker: {
                    color: colors,
                    line: {
                        color: models.map(model => 
                            model === 'Random Forest' ? '#FFA500' : '#636EFA'
                        ),
                        width: 2
                    }
                },
                text: accuracyValues.map(v => v.toFixed(4)),
                textposition: 'outside',
                textfont: { 
                    size: 12,
                    color: 'black'
                },
                showlegend: false
            };
            
            const layout = {
                title: {
                    text: 'Sub-objective 6: Efficiency Optimization',
                    font: { 
                        size: 18,
                        color: '#2c3e50',
                        family: 'Arial, sans-serif'
                    },
                    x: 0.5,
                    xanchor: 'center'
                },
                xaxis: { 
                    title: {
                        text: 'Models',
                        font: { size: 14 }
                    },
                    tickfont: { size: 11 },
                    tickangle: -45,
                    automargin: true,
                    tickmode: 'array',
                    tickvals: models,
                    ticktext: models
                },
                yaxis: { 
                    title: {
                        text: 'Accuracy',
                        font: { size: 14 }
                    },
                    range: [0, 1.05],
                    tickfont: { size: 12 },
                    tickformat: '.2f'
                },
                height: 500,
                showlegend: false,
                plot_bgcolor: 'rgba(248, 249, 250, 0.8)',
                paper_bgcolor: 'white',
                margin: {
                    l: 80,
                    r: 150,
                    t: 80,
                    b: 140
                },
                annotations: [
                    {
                        text: 'CLASSIFICATION',
                        x: 1.02,
                        y: 0.95,
                        xref: 'paper',
                        yref: 'paper',
                        showarrow: false,
                        font: {
                            size: 12,
                            color: 'white',
                            family: 'Arial, sans-serif'
                        },
                        bgcolor: '#E91E63',
                        bordercolor: '#E91E63',
                        borderwidth: 2,
                        borderpad: 8,
                        xanchor: 'left'
                    }
                ]
            };
            
            Plotly.newPlot('chartContainer', [trace], layout, {responsive: true});
            
            // Show best model banner
            document.getElementById('bestModelBanner').innerHTML = 
                `<div class="best-model-banner">
                    <i class="fas fa-trophy"></i> Best Model: ${bestModel} (Accuracy = ${bestScore.toFixed(4)})
                </div>`;
            document.getElementById('bestModelBanner').style.display = 'block';
        }
        
        // Auto-load chart on page load
        window.onload = function() {
            loadChart();
        };
    </script>
</body>
</html>
